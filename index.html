<!DOCTYPE html>
<html>
<head>
    <title>Peta Rental PS MVP - Fase Mockup Statis</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 100vh; width: 100%; margin: 0; padding: 0; }
        body { margin: 0; }

        .leaflet-popup-content-wrapper {
            background-color: #1e1e1e;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            padding: 5px;
            color: #fff;
        }
        .leaflet-popup-content {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #f1f1f1;
        }
        .leaflet-popup-tip { background-color: #1e1e1e; }

        .booking-btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s ease;
            text-align: center;
            width: 100%;
            margin-top: 10px;
            box-sizing: border-box;
            border: 1px solid #0056b3;
        }
        .booking-btn:hover { background-color: #0056b3; }
        
        .jarak-info {
            background-color: #2d2d2d;
            padding: 5px;
            border-radius: 5px;
            margin-top: 10px;
            font-size: 0.9em;
            color: #adb5bd;
            border: 1px solid #444;
        }

        .jarak-label {
            background: rgba(30, 30, 30, 0.9);
            border: 1px solid #007bff;
            border-radius: 4px;
            color: #007bff;
            font-size: 11px;
            font-weight: bold;
            text-align: center;
            padding: 2px 4px;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([-0.49, 117.14], 13);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        const userLokasi = L.latLng([-0.485, 117.145]); 
        
        L.circleMarker(userLokasi, {
            radius: 9,
            fillColor: "#ff4757",
            color: "#ffffff",
            weight: 2,
            opacity: 1,
            fillOpacity: 1
        }).addTo(map).bindPopup("<b style='color:#333'>Lokasi Kamu</b><br><span style='color:#333'>Segera buat database-mu.</span>").openPopup();

        // Ikon Gamepad
        var urlIkonKeren = 'https://img.icons8.com/fluency/96/controller.png';
        var ikonPS = L.icon({
            iconUrl: urlIkonKeren,
            iconSize: [40, 40],
            iconAnchor: [20, 40],
            popupAnchor: [0, -35]
        });

        // Data Rental PS Hardcoded
        const dataRentalPS = [
            {
                nama: "Champion Station", lat: -0.4722, lng: 117.1463,
                status: "🟢 2 Unit PS5 Kosong",
                harga: "Rp 15.000/jam (PS5)",
                fasilitas: "TV 4K 50\", AC Dingin, Indomie",
                logoUrl: 'https://img.icons8.com/color/96/playstation.png',
                infoKhusus: "Paket Begadang: 50k (22.00 - 06.00)"
            },
            {
                nama: "Mahdi Gamezone", lat: -0.4968, lng: 117.1582,
                status: "🔴 Penuh (Antrean 1 Orang)",
                harga: "Rp 10.000/jam (PS4)",
                fasilitas: "TV 43\", Kipas Angin, Es Teh",
                logoUrl: 'https://img.icons8.com/color/96/playstation.png',
                infoKhusus: "Main 5 Jam Gratis 1 Jam."
            },
            {
                nama: "eFootball Arena", lat: -0.5221, lng: 117.1157,
                status: "🟢 4 Unit PS4 Kosong",
                harga: "Rp 12.000/jam (PS4 Pro)",
                fasilitas: "Ruang VIP, Sofa Empuk",
                logoUrl: 'https://img.icons8.com/color/96/playstation.png',
                infoKhusus: "Turnamen eFootball tiap Sabtu!"
            }
        ];

        dataRentalPS.forEach(tempat => {
            const tujuan = L.latLng(tempat.lat, tempat.lng);
            
            const jarakMeter = map.distance(userLokasi, tujuan);
            const jarakKm = (jarakMeter / 1000).toFixed(2);

            L.polyline([userLokasi, tujuan], {
                color: '#007bff',
                weight: 2,
                dashArray: '5, 8',
                opacity: 0.7
            }).addTo(map);

            const midLat = (userLokasi.lat + tujuan.lat) / 2;
            const midLng = (userLokasi.lng + tujuan.lng) / 2;
            
            const labelJarakIcon = L.divIcon({
                className: 'custom-div-icon',
                html: `<div class="jarak-label">${jarakKm} km</div>`,
                iconSize: [40, 20],
                iconAnchor: [20, 10] 
            });

            L.marker([midLat, midLng], { icon: labelJarakIcon }).addTo(map);

            const popupContent = `
                <div style='text-align: center; max-width: 250px;'>
                    <img src='${tempat.logoUrl}' alt='Logo PS' style='width: 50px; margin-bottom: 5px;'><br>
                    <b style='font-size: 1.2em; color: #66b2ff;'>${tempat.nama}</b><br>
                    <span style='color: ${tempat.status.includes('🟢') ? '#28a745' : '#dc3545'}; font-weight: bold;'>${tempat.status}</span><br>
                    
                    <div class='jarak-info'>
                        🕹️ Fasilitas: ${tempat.fasilitas}<br>
                        💰 Harga: ${tempat.harga}<br>
                        📍 Jarak: ${jarakKm} km
                    </div>
                    
                    <hr style='border: 0; border-top: 1px solid #444; margin: 10px 0;'>
                    <div style='margin-bottom: 15px; font-size: 0.9em;'>
                        <strong style='color: #ffc107;'>Promo: ${tempat.infoKhusus}</strong>
                    </div>
                    <a href='#' class='booking-btn' onclick='alert("Logika booking belum ada karena kamu menolak membuat database.")'>Booking Sekarang</a>
                </div>
            `;

            L.marker(tujuan, { icon: ikonPS })
                .bindPopup(popupContent)
                .addTo(map);
        });
    </script>
</body>
</html>
